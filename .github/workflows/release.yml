name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version without v prefix'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        run: sdkmanager 'platforms;android-30' 'build-tools;30.0.2'

      - name: Set up Java 11 for the legacy Gradle build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Restore release signing key
        shell: bash
        run: |
          mkdir -p keystore
          printf '%s' '${{ secrets.SIGNING_KEY_B64 }}' | base64 --decode > keystore/ejchan-release.p12
          cat > keystore.properties <<EOF
          store.file=${GITHUB_WORKSPACE}/keystore/ejchan-release.p12
          store.password=${{ secrets.SIGNING_STORE_PASSWORD }}
          key.alias=${{ secrets.SIGNING_KEY_ALIAS }}
          key.password=${{ secrets.SIGNING_KEY_PASSWORD }}
          EOF
          chmod 600 keystore/ejchan-release.p12 keystore.properties

      - name: Build signed APK
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: ./gradlew :extensions:ejchan:assembleRelease --no-daemon --max-workers=1

      - name: Prepare release files and metadata
        id: artifact
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.value }}'
          SOURCE='extensions/ejchan/build/outputs/apk/release/DashchanEjchan-release.apk'
          APK="DashchanEjchan-${VERSION}.apk"
          cp "$SOURCE" "$APK"
          sha256sum "$APK" > "${APK}.sha256"
          CERT=$(${ANDROID_HOME}/build-tools/30.0.2/apksigner verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          python3 scripts/update_metadata.py --version "$VERSION" --apk "$APK" --certificate "$CERT" --output update/data.json
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          APK='${{ steps.artifact.outputs.apk }}'
          TAG="v${{ steps.version.outputs.value }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "${APK}.sha256" --clobber
          else
            gh release create "$TAG" "$APK" "${APK}.sha256" --title "$TAG" --generate-notes
          fi

      - name: Update Dashchan metadata on main
        shell: bash
        run: |
          cp update/data.json /tmp/ejchan-update-data.json
          git fetch origin main
          git checkout main
          cp /tmp/ejchan-update-data.json update/data.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add update/data.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update metadata for v${{ steps.version.outputs.value }} [skip ci]"
          git push origin main
